ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    DocumentRoot /app/public

    <Directory /app/public>
        Require all granted
        AllowOverride None

        # The front controller. Anything that is not a real file on disk goes
        # to index.php — no rewrite rules, no mod_rewrite.
        FallbackResource /index.php
    </Directory>

    # Belt and braces: the database and any dotfile stay unreachable even if
    # something one day ends up inside the document root.
    <FilesMatch "^\.|\.sqlite">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options nosniff
    Header always set X-Frame-Options SAMEORIGIN
    Header always set Referrer-Policy strict-origin-when-cross-origin

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
