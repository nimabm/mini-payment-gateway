memory_limit = 256M
max_execution_time = 30
expose_php = Off

; Storage is UTC everywhere; the panel converts on the way out.
date.timezone = UTC

; Errors are logged, never rendered. The application's error handler decides
; what a client sees.
display_errors = Off
log_errors = On
error_log = /dev/stderr

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
