name: mini-payment-gateway

services:
  app:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:80"
    env_file: .env
    volumes:
      # A named volume, not a bind mount: SQLite's file locking is unreliable
      # across the macOS and Windows bind-mount layer.
      - gateway-data:/var/lib/gateway
    restart: unless-stopped

  # Webhook retries, PSP reconciliation, payment expiry. Same image, different
  # command. Without it, stuck payments are never resolved.
  worker:
    build: .
    command: ["php", "/app/bin/console", "worker:run"]
    env_file: .env
    volumes:
      - gateway-data:/var/lib/gateway
    depends_on:
      - app
    restart: unless-stopped

volumes:
  gateway-data:
